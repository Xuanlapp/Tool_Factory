name: Build and Release Windows App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install Tool dependencies
        run: npm ci
        working-directory: Tool
      - name: Build web
        run: npm --workspace @acrylic/web run build
      - name: Build Tool bundle
        run: npm run build
        working-directory: Tool
      - name: Build and publish Windows installer
        run: npm --workspace @acrylic/desktop run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          generate_release_notes: true
